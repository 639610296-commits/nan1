/* 顶部轮播 */

.card-slide{

/* 公告 */

.notice-title{
    color:#2d7cff;
    font-weight:700;
    margin-right:10px;
}

.notice-box{
    flex:1;
    overflow:hidden;
}

.notice-list{
    display:flex;
    white-space:nowrap;
    width:max-content;
    animation:noticeMove 18s linear infinite;
}

.notice-list div{

}

@keyframes noticeMove{

0%{
transform:translateX(100%);

/* 列表 */

.grid{

/* 卡片 */

.card-info h3{

/* 底部 */

<script>

document.querySelectorAll(".card-slider").forEach(function(slider){

    const track = slider.querySelector(".card-slider-track");
    const slides = slider.querySelectorAll(".card-slide");

    let index = 0;

    function showSlide(){
        track.style.transform =
            "translateX(-" + (index * 33.333333) + "%)";
    }

    setInterval(function(){

        index++;

        if(index >= slides.length){
            index = 0;
        }

        showSlide();

    },3000);

    let startX = 0;
    let startY = 0;

    slider.addEventListener("touchstart",function(e){

        startX = e.touches[0].clientX;
        startY = e.touches[0].clientY;

    });

    slider.addEventListener("touchend",function(e){

        const endX = e.changedTouches[0].clientX;
        const endY = e.changedTouches[0].clientY;

        const moveX = endX - startX;
        const moveY = endY - startY;

        if(Math.abs(moveX) > 50 && Math.abs(moveX) > Math.abs(moveY)){

            if(moveX < 0){
                index++;
            }else{
                index--;
            }

            if(index >= slides.length){
                index = 0;
            }

            if(index < 0){
                index = slides.length - 1;
            }

            showSlide();

        }

    });

});

</script>
