<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>官方导航</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:"PingFang SC","Microsoft YaHei",sans-serif;
}

body{
    background:#edf5ff;
    padding:15px;
}

.container{
    max-width:700px;
    margin:auto;
}

.banner img{
    width:100%;
    display:block;
    border-radius:18px;
    box-shadow:0 10px 25px rgba(0,0,0,.08);
}

.notice,
.contact{
    margin-top:15px;
    background:#fff;
    border-radius:16px;
    padding:18px;
    font-size:16px;
    line-height:32px;
    box-shadow:0 5px 15px rgba(0,0,0,.05);
}

.title{
    margin:28px 0 18px;
    text-align:center;
    font-size:28px;
    font-weight:bold;
    color:#3b6ff7;
}

.grid{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:15px;
}

.card{
    background:#fff;
    border-radius:20px;
    overflow:hidden;
    text-decoration:none;
    color:#222;
    box-shadow:0 8px 20px rgba(0,0,0,.08);
}

.card img{
    width:100%;
    aspect-ratio:1/1;
    object-fit:cover;
    display:block;
}

.card-title{
    padding:12px;
    text-align:center;
    font-size:17px;
    font-weight:bold;
}

.footer{
    text-align:center;
    padding:30px;
    color:#666;
}

</style>
</head>
